[project]
name = "acap"
version = "0.1.0"
description = "A-CAP: Anticipation Captioning with Commonsense Knowledge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.30.0",
    "Pillow>=9.0.0",
    "requests>=2.28.0",
    "numpy>=1.23.0",
    "tqdm>=4.64.0",
    "pycocoevalcap>=1.2",
    "pycocotools>=2.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["models", "data", "utils"]
py-modules = ["config", "train", "eval", "metrics"]

[tool.uv]
package = true
